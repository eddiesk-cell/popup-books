<script>/* the intro doors (library.css "the intro doors"): drawn by the SVG above, closed from the first paint, nothing to load. library.js opens them (window.__introPlay) once the room behind them has drawn
   and settled; its promise resolves at the threshold, where library.js takes over (through the doorway, the fall). A return visit or ?intro=0: none. A browser without view transitions gets .novt (the doors ease in). */
{ const h = document.documentElement, d = document.getElementById("doors"); const q = new URLSearchParams(location.search); let seen = q.get("intro") === "0" || q.has("door"); try { const fromFront = sessionStorage.getItem("wst-intro-play") === "1"; sessionStorage.removeItem("wst-intro-play"); seen ||= localStorage.getItem("wst-intro-seen") === "1" && !fromFront; } catch {}
  if (!("CSSViewTransitionRule" in window)) h.classList.add("novt");
  window.__introPlay = () => new Promise(ok => { d.classList.remove("go", "in"); void d.offsetWidth; h.dataset.intro = "go"; d.classList.add("go"); d.onanimationend = e => { if (e.animationName === "through") { h.dataset.intro = "through"; ok(); } }; });
  d.hidden = seen; window.__intro = !seen; }
</script>
