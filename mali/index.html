<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mali and the Lantern Market</title>
<style>
  :root { --ink: #f6e7c8; --glow: #ffb45a; --night: #07080f; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink);
    font-family: Georgia, "Times New Roman", serif; overflow: hidden; touch-action: none; user-select: none; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  canvas, video { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; display: block; }
  [hidden] { display: none !important; }
  video { position: absolute; transition: opacity .3s; pointer-events: none; }
  #title { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 18px;
    background: radial-gradient(circle at 50% 45%, #1c1a2c 0%, var(--night) 70%); cursor: pointer; }
  #title h1 { margin: 0; font-weight: normal; font-style: italic; font-size: clamp(28px, 6vw, 64px); letter-spacing: .02em; }
  #title p, #msg { margin: 0; opacity: .8; font-size: clamp(16px, 2.6vw, 24px); }
  button { font: inherit; color: var(--night); background: var(--glow); border: 0; border-radius: 999px;
    padding: 12px 28px; font-size: clamp(16px, 2.4vw, 22px); cursor: pointer; justify-self: center; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  #hud { position: absolute; top: 16px; left: 50%; translate: -50%; display: flex; gap: 10px; opacity: 0; transition: opacity .6s; }
  #hud span { width: 22px; height: 26px; border-radius: 50% 50% 46% 46%; background: #3a3540; box-shadow: inset 0 -3px 0 #0003; transition: .5s; }
  #hud span.on { background: var(--glow); box-shadow: 0 0 14px var(--glow); }
  #msg { position: absolute; bottom: 6%; left: 50%; translate: -50%; text-align: center; opacity: 0; transition: opacity .8s;
    text-shadow: 0 2px 10px #000; display: grid; gap: 14px; width: min(90vw, 640px); pointer-events: none; }
  #msg button { pointer-events: auto; }
  .show { opacity: 1 !important; }
</style>
</head>
<body>
<div id="stage">
  <video id="loop" muted playsinline loop preload="auto" hidden></video>
  <canvas id="view" width="1280" height="720" tabindex="0"
    aria-label="The pop-up book. Drag the bottom corner of a page to turn it, or use the arrow keys."></canvas>
  <video id="finale" muted playsinline preload="auto" hidden></video>
</div>
<div id="hud" aria-live="polite" aria-label="Lights lit"></div>
<div id="msg" aria-live="polite"></div>
<div id="title" role="button" tabindex="0">
  <h1>Mali and the Lantern Market</h1>
  <p id="go">Loading the book…</p>
</div>
<script type="module">
import { Frames, PageDrag } from "./flip.js";

// One entry per built spread, in reading order. Each has open/ (its turn in, frames 0-72, then the
// pop-ups coming alive, 73-155), close/ when a page follows it (the turn away), a loop with the game,
// and a finale: "video" plays finale.mp4 once, "lit" fades to the lit half of the loop.
const BOOK = [
  { dir: "kite", finale: "video", exit: true, next: "Turn the page",
    start: "The village is sending little leaf boats down the river. Tap the dark boats to light their candles!",
    hint: "Look for the boats on the water that have no light.",
    count: (n, all) => `${n} of ${all} boats are sailing.`,
    waiting: "Every boat is sailing! Now watch the sky...",
    done: "Whoosh! The wind snatched Mali's red kite and carried it away over the river." },
  { dir: "market", finale: "lit", exit: false, next: "Read it again",
    start: "The spirits' lanterns have gone dark. Tap them to light them again!",
    hint: "Look for the grey lanterns floating in the air.",
    count: (n, all) => `${n} of ${all} lanterns glow again.`,
    done: "Every lantern shines! The spirits come out to thank Mali." },
];
const TURN = 72, OPEN = 156, CLOSE = 73, W = 1280, H = 720, FPS = 24;
const $ = id => document.getElementById(id);
const loop = $("loop"), fin = $("finale"), view = $("view"), ctx = view.getContext("2d");

const cache = {};
const json = url => fetch(url).then(r => r.json());
const load = p => cache[p.dir] ??= {
  open: new Frames(`${p.dir}/open/`, OPEN), cin: json(`${p.dir}/corners-in.json`),
  close: p.exit && new Frames(`${p.dir}/close/`, CLOSE), cout: p.exit && json(`${p.dir}/corners-out.json`),
  targets: json(`${p.dir}/targets.json`),
};

let i = 0, mode = "title", page = BOOK[0], drag = null, fingerX = 0, down = false;
let pos, lit, litAt, finaleAt, waitWrap, frame = 0, prev = 0, hintTimer, peelAt = 0;

// ---------- reading: between spreads, a page lies ready to be turned ----------
function toText(k) {
  i = k; page = BOOK[k]; mode = "text"; peelAt = performance.now() + 1500;
  fin.hidden = true; loop.pause(); $("hud").classList.remove("show");
  load(page).open.draw(ctx, 0);
  say(k === 0 ? "Pull the corner of the page to turn it." : "");
  load(page); if (k > 0) load(BOOK[k - 1]);
}

async function turn(fwd, auto, x0 = fingerX) {
  if (!["text", "open", "end"].includes(mode)) return;
  const R = load(page);
  let frames, corners, a, b, onLand;
  if (mode === "text") {
    if (fwd) [frames, corners, a, b, onLand] = [R.open, R.cin, 0, TURN, e => e ? alive() : toText(i)];
    else if (i > 0) {
      const Q = load(BOOK[i - 1]);
      [frames, corners, a, b, onLand] = [Q.close, Q.cout, CLOSE - 1, 0, e => e ? (toPage(i - 1), alive()) : toText(i)];
    } else return;
  } else {
    if (fwd && !page.exit) return;
    await duck();  // the pop-ups fold in first; the pull the finger made meanwhile still counts
    if (fwd) [frames, corners, a, b, onLand] = [R.close, R.cout, 0, CLOSE - 1, e => e ? toText(i + 1) : alive()];
    else [frames, corners, a, b, onLand] = [R.open, R.cin, TURN, 0, e => e ? toText(i) : alive()];
  }
  mode = "turn"; say("");
  const track = (await corners).corners;
  drag = new PageDrag(t => frames.draw(ctx, t), onLand);
  drag.grab(track, a, b, auto ? track[a][0] : x0);
  if (auto) drag.auto(); else { drag.move(fingerX); if (!down) drag.release(); }
}

function toPage(k) { i = k; page = BOOK[k]; }

function play(frames, from, to, ms) {  // run frames from -> to on the canvas over ms
  return new Promise(done => {
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / ms);
      frames.draw(ctx, from + (to - from) * k);
      k < 1 ? requestAnimationFrame(step) : done();
    };
    requestAnimationFrame(step);
  });
}

async function duck() {  // the living things fold back into the page before it can be turned
  const was = mode; mode = "duck"; say(""); $("hud").classList.remove("show"); clearTimeout(hintTimer);
  loop.pause();
  if (was === "end" && page.finale === "video") { load(page).open.draw(ctx, TURN); fin.hidden = true; return; }
  await play(load(page).open, OPEN - 1, TURN, 450);
}

async function alive() {  // the page lies open: its pop-ups come alive, then the game starts
  mode = "alive";
  loop.src = `${page.dir}/loop.mp4`; loop.load();
  if (page.finale === "video") fin.src = `${page.dir}/finale.mp4`;
  const R = load(page); pos = (await R.targets).targets;
  await play(R.open, TURN, OPEN - 1, (OPEN - 1 - TURN) / FPS * 1000);
  openPage();
}

// ---------- the open spread: the game on the loop ----------
function openPage() {
  mode = "open"; lit = pos[0].map(() => false); litAt = []; finaleAt = 0; waitWrap = false; prev = 0;
  $("hud").innerHTML = lit.map(() => "<span></span>").join(""); $("hud").classList.add("show");
  loop.currentTime = 0; loop.play();               // the loop's first frame follows the page's last
  say(page.start);
  hintTimer = setTimeout(() => say(page.hint), 9000);
  if (BOOK[i + 1]) load(BOOK[i + 1]);
}

const off = document.createElement("canvas"), octx = off.getContext("2d");
function render(now) {
  frame = Math.floor(loop.currentTime * FPS + 0.01) % pos.length;
  if (waitWrap && frame < prev) playFinale();      // cut to the finale where the loop starts over: seamless
  prev = frame;
  ctx.globalAlpha = 1;
  ctx.drawImage(loop, 0, 0, W, H, 0, 0, W, H);     // top half: dark
  pos[frame].forEach(([x, y, r], k) => {
    if (!lit[k]) return mode === "open" && hint(x, y, r, now);
    const a = Math.min(1, (now - litAt[k]) / 500), R = Math.max(40, r * W * 2.6);
    off.width = off.height = 2 * R;
    octx.drawImage(loop, x * W - R, H + y * H - R, 2 * R, 2 * R, 0, 0, 2 * R, 2 * R);  // bottom half: lit
    octx.globalCompositeOperation = "destination-in";
    const g = octx.createRadialGradient(R, R, R * 0.35, R, R, R);
    g.addColorStop(0, "#000"); g.addColorStop(1, "#0000");
    octx.fillStyle = g; octx.fillRect(0, 0, 2 * R, 2 * R);
    octx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = a; ctx.drawImage(off, x * W - R, y * H - R);
  });
  if (finaleAt) {
    ctx.globalAlpha = Math.min(1, (now - finaleAt) / 1200);
    ctx.drawImage(loop, 0, H, W, H, 0, 0, W, H);
  }
  ctx.globalAlpha = 1;
}

function hint(x, y, r, now) {                      // a soft breathing ring says "tap me"
  const k = 0.5 + 0.5 * Math.sin(now / 420);
  ctx.globalAlpha = 0.25 + 0.35 * k;
  ctx.strokeStyle = "#ffd9a0"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x * W, y * H, r * W * (1.1 + 0.25 * k), 0, 7); ctx.stroke();
  ctx.globalAlpha = 1;
}

function light(k) {
  if (mode !== "open" || k < 0 || lit[k] || finaleAt || waitWrap) return;
  lit[k] = true; litAt[k] = performance.now();
  $("hud").children[k].classList.add("on");
  clearTimeout(hintTimer);
  const n = lit.filter(Boolean).length;
  say(n < lit.length ? page.count(n, lit.length) : "");
  if (n < lit.length) return;
  if (page.finale === "lit") setTimeout(() => { finaleAt = performance.now(); mode = "end"; say(page.done, true); }, 700);
  else setTimeout(() => { waitWrap = true; say(page.waiting); }, 700);
}

function playFinale() {
  waitWrap = false; mode = "fin";
  fin.currentTime = 0; fin.style.opacity = 0; fin.hidden = false;
  fin.onplaying = () => { fin.style.opacity = 1; setTimeout(() => loop.pause(), 300); };
  fin.onended = () => { mode = "end"; say(page.done, true); };
  fin.play();
}

function say(text, end) {
  $("msg").innerHTML = text ? `<p>${text}</p>` + (end ? `<button id="next">${page.next}</button>` : "") : "";
  $("msg").classList.toggle("show", !!text);
  if (end) { $("next").onclick = () => page.exit ? turn(true, true) : location.reload(); $("next").focus(); }
}

// ---------- every frame: the game, or a page corner that lifts now and then to say "pull me" ----------
requestAnimationFrame(function tick(now) {
  if ((mode === "open" || mode === "end" || mode === "fin") && pos && !(mode === "fin" && !waitWrap && loop.paused)) render(now);
  if (mode === "text" && now > peelAt) {
    const k = (now - peelAt) / 900;
    load(page).open.draw(ctx, k < 1 ? 3 * Math.sin(Math.PI * k) : 0);
    if (k >= 1) peelAt = now + 3500;
  }
  requestAnimationFrame(tick);
});

// ---------- hands and keys ----------
const at = e => { const b = view.getBoundingClientRect(); return [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height]; };
let pend = null;
view.addEventListener("pointerdown", e => {
  const [x, y] = at(e); fingerX = x; down = true;
  if (mode === "open" && tap(x, y)) return;
  if (["text", "open", "end"].includes(mode) && y > 0.4) { pend = { x, fwd: x > 0.5 }; view.setPointerCapture(e.pointerId); }
});
view.addEventListener("pointermove", e => {
  const [x, y] = at(e); fingerX = x;
  view.style.cursor = drag?.live && drag.held ? "grabbing" : ["text", "open", "end"].includes(mode) && y > 0.4 ? "grab" : "";
  if (pend && Math.abs(x - pend.x) > 0.015) { turn(pend.fwd, false, pend.x); pend = null; }
  else if (drag?.live && drag.held) drag.move(x);
});
const up = () => { down = false; pend = null; if (drag?.live) drag.release(); };
view.addEventListener("pointerup", up); view.addEventListener("pointercancel", up);

function tap(px, py) {                             // generous, kid-sized hit area on the targets
  let best = -1, bestD = Infinity;
  pos[frame].forEach(([x, y, r], k) => {
    const d = Math.hypot((px - x) * 16 / 9, py - y);
    if (!lit[k] && d < Math.max(r * 3, 0.06) && d < bestD) { best = k; bestD = d; }
  });
  if (best >= 0) light(best);
  return best >= 0;
}

document.addEventListener("keydown", e => {
  if (mode === "title") return;
  if (e.key === "ArrowRight") turn(true, true);
  else if (e.key === "ArrowLeft") turn(false, true);
  else if ((e.key === "Enter" || e.key === " ") && mode === "open" && document.activeElement === view) { e.preventDefault(); light(lit.indexOf(false)); }
});

const R0 = load(BOOK[0]);
R0.open.imgs[0].decode().then(() => { $("go").textContent = "Tap to open the book"; });
const start = () => { if (mode !== "title") return; $("title").remove(); view.focus(); toText(0); };
$("title").onclick = start;
$("title").onkeydown = e => (e.key === "Enter" || e.key === " ") && start();
</script>
</body>
</html>
